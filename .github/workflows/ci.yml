name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://stratum:stratum@localhost:5432/stratum_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Lint and typecheck run here too, not only in the pre-push hook, so a
      # `--no-verify` push or a fork PR cannot skip them. This mirrors what
      # `npm run verify` does locally, keeping CI and the hook in agreement.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build

      # Every workspace package. The `test` task is unit-only: mysql and mongodb
      # exclude src/__tests__/integration/** from their vitest config, and
      # integration-tests only runs under `test:integration`. Those DB-backed suites
      # keep their own workflows (ci-integration.yml, ci-mongo-integration.yml), so
      # nothing here needs a service container.
      - name: Test
        run: npm test
