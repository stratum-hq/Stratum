name: Website

# The docs Playground builds @stratum-hq/lib and the PGlite adapter from
# packages/, so a change there can break the docs build or the Playground.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/lib/**"
      - "packages/core/**"
      - "packages/sdk/**"
      - "packages/db-adapters/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "packages/lib/**"
      - "packages/core/**"
      - "packages/sdk/**"
      - "packages/db-adapters/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  # Cloudflare Pages installs only website/ and builds there, with no
  # node_modules above packages/. This job matches that, so a dependency the
  # Playground needs but website/package.json does not declare fails here.
  pages-build:
    name: Docs build (website-only install, as on Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies only
        run: npm ci
        working-directory: website

      - name: Build the docs
        run: npm run build
        working-directory: website

  playground:
    name: Docs build & Playground check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Astro 7 needs Node 22.12 or later.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      # The monorepo path: a root install alongside website/, as in local
      # development.
      - name: Install workspace dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build the docs
        run: npm run build
        working-directory: website

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: website

      # Starts `astro preview` and checks the locked-config refusal, the RLS
      # row counts and the subtree reads in the built Playground.
      - name: Playground check
        run: npx playwright test
        working-directory: website
