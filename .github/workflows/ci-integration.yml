name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stratum_test
          POSTGRES_PASSWORD: stratum_test
          POSTGRES_DB: stratum_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stratum_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The generated MySQL and MongoDB presets of @stratum-hq/create run their
      # isolation tests against these servers.
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand('ping')\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stratum_test:stratum_test@localhost:5433/stratum_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run integration tests
        # Only this run gets the MySQL and MongoDB URLs. Those suites do not use
        # adminPool, so the second run skips them and the job stays shorter.
        env:
          MYSQL_URL: mysql://root@localhost:3306
          MONGODB_URL: mongodb://localhost:27017
        run: cd packages/integration-tests && npx vitest run --config vitest.config.ts
      # The same suites with adminPool on a login that is not a superuser and
      # reaches the Stratum tables only through the control role (migration
      # 032). A separate database, so the first run's state does not carry over.
      - name: Create the admin-mode database
        run: >-
          node -e "const pg = require('pg'); const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          c.connect().then(() => c.query('CREATE DATABASE stratum_test_admin')).then(() => c.end())"
      - name: Run integration tests with adminPool
        env:
          STRATUM_IT_ADMIN_POOL: "1"
          DATABASE_URL: postgresql://stratum_test:stratum_test@localhost:5433/stratum_test_admin
        run: cd packages/integration-tests && npx vitest run --config vitest.config.ts
