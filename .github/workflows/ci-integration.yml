name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stratum_test
          POSTGRES_PASSWORD: stratum_test
          POSTGRES_DB: stratum_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stratum_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stratum_test:stratum_test@localhost:5433/stratum_test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run integration tests
        run: cd packages/integration-tests && npx vitest run --config vitest.config.ts
