# Publish packages to npm on version tag push
#
# Auth: npm Trusted Publishing (OIDC) — each @stratum-hq package must have a
# GitHub Actions trusted publisher configured on npmjs.com pointing at
# stratum-hq/Stratum + publish.yml. No token secret required.

name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard reads the tag object itself and needs main to compare
          # against, so it needs the full history and the tags with it.
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse tags that are not deliberate releases
        run: scripts/release-guard.sh "${GITHUB_REF_NAME}"

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci
      - run: npm run build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://stratum:stratum@localhost:5432/stratum_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    name: Publish
    needs: test
    # Requires manual approval from a required reviewer on the `publish`
    # environment before any npm publish runs (arms #174).
    environment: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted publishing (OIDC) needs npm >= 11.5. Pin the 11.x line: npm@latest is
      # now 12.x which requires Node 22+, and this job runs Node 20.
      - run: npm install -g npm@^11.5.0

      - run: npm ci
      - run: npm run build
      - name: Publish packages (skip already-published versions)
        run: |
          failed=0
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              name=$(node -p "require('./$pkg/package.json').name")
              version=$(node -p "require('./$pkg/package.json').version")
              is_private=$(node -p "require('./$pkg/package.json').private || false")
              if [ "$is_private" = "true" ]; then
                echo "⏭️  $name (private, skipping)"
                continue
              fi
              output=$(cd "$pkg" && npm publish --access public 2>&1) && {
                echo "✅ $name@$version published"
              } || {
                if echo "$output" | grep -q "You cannot publish over the previously published"; then
                  echo "⏭️  $name@$version already published, skipping"
                else
                  echo "❌ $name@$version failed to publish"
                  echo "$output"
                  failed=1
                fi
              }
            fi
          done
          exit $failed
